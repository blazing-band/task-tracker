name: task-tracker

services:
  postgresql:
    container_name: task-tracker-postgresql
    image: postgres:18.4
    restart: unless-stopped
    ports:
      - "${DB_PORT}:5432"
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_PASSWORD: ${DB_PASS}
      POSTGRES_USER: ${DB_USER}
    volumes:
      - task_tracker_postgres:/var/lib/postgresql
    healthcheck:
      test: [ "CMD", "pg_isready", "-U", "${DB_USER}", "-d", "${DB_NAME}" ]
      interval: 30s
      timeout: 10s
      retries: 5

  redis:
    container_name: task-tracker-redis
    image: redis:8.10.0
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD} --appendonly yes
    ports:
      - "6379:6379"
    healthcheck:
      test: [ "CMD", "redis-cli", "-a", "$REDIS_PASSWORD", "ping" ]
      interval: 30s
      timeout: 10s
      retries: 5

  rabbitmq:
    container_name: task-tracker-email-sender-rabbitmq
    image: rabbitmq:4.4.0-management-alpine
    restart: unless-stopped
    ports:
      - "5672:5672"             # AMQP
      - "15672:15672"           # Web UI
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VHOST}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: [ "CMD", "rabbitmq-diagnostics", "-q", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    container_name: task-tracker-backend
    build:
      context: https://github.com/blazing-band/task-tracker-backend.git
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${BACKEND_APP_PORT}:${BACKEND_APP_PORT}"
    environment:
      PORT: ${BACKEND_APP_PORT}
      CORS_ORIGIN: ${BACKEND_APP_CORS_ORIGINS}
      DB_DRIVER: ${DB_DRIVER}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASS: ${DB_PASS}
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      JWT_ALGORITHM: ${JWT_ALGORITHM}
      JWT_SECRET: ${JWT_SECRET}
      JWT_ACCESS_EXPIRATION_MINUTES: ${JWT_ACCESS_EXPIRATION_MINUTES}
      JWT_REFRESH_EXPIRATION_MINUTES: ${JWT_REFRESH_EXPIRATION_MINUTES}
    depends:
      postgresql:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  email-sender-web:
    container_name: task-tracker-email-sender-web
    build:
      context: https://github.com/blazing-band/task-tracker-email-sender.git
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${EMAIL_SENDER_APP_PORT}:${EMAIL_SENDER__APP_PORT}"
    environment:
      PORT: ${EMAIL_SENDER_APP_PORT}
      RABBITMQ_USER: ${RABBITMQ_USER}
      RABBITMQ_PASS: ${RABBITMQ_PASS}
      RABBITMQ_VHOST: ${RABBITMQ_VHOST}
    depends:
      backend:
        condition: service_started

  email-sender-worker:
    container_name: task-tracker-email-sender-web
    build:
      context: https://github.com/blazing-band/task-tracker-email-sender.git
      dockerfile: Dockerfile
    command: celery -A src.email_sender.tasks worker --loglevel=INFO
    restart: unless-stopped
    environment:
      RABBITMQ_USER: ${RABBITMQ_USER}
      RABBITMQ_PASS: ${RABBITMQ_PASS}
      RABBITMQ_VHOST: ${RABBITMQ_VHOST}
    depends:
      backend:
        condition: service_started

volumes:
  task_tracker_postgres:
  task_tracker_rabbitmq:
